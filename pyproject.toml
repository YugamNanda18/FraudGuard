[project]
name = "fraudai-agent"
version = "0.1.0"
description = "AI agentic platform for banking fraud detection and AI red teaming in FinTech"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Adrian Infantes" },
]
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-community>=0.3",
    "langchain-huggingface>=0.1",
    "qdrant-client>=1.13",
    "sentence-transformers>=3.3",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "networkx>=3.4",
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn>=1.6",
    "beautifulsoup4>=4.12",
    "docker>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudai"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# B008: Depends() in defaults is idiomatic FastAPI dependency injection.
"src/fraudai/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
