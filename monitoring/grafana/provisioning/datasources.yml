# =============================================================================
# Grafana Datasource Provisioning — FraudAI Agent
#
# Configures Prometheus as the default datasource.
# URL assumes Docker Compose networking (service name = hostname).
# =============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
