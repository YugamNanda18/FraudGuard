# =============================================================================
# Grafana Dashboard Provisioning — FraudAI Agent
#
# Auto-loads dashboards from the mounted volume.
# Reference: https://grafana.com/docs/grafana/latest/administration/provisioning/
# =============================================================================

apiVersion: 1

providers:
  - name: FraudAI
    orgId: 1
    folder: FraudAI
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
