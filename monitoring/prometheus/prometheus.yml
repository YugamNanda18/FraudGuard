# =============================================================================
# Prometheus Configuration — FraudAI Agent
#
# Scrape targets:
#   - fraudai: Main application metrics (auth required)
#   - qdrant:  Vector database metrics
#   - ollama:  Local LLM metrics
#   - prometheus: Self-monitoring
#
# Alert rules loaded from /etc/prometheus/rules/*.yml
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

# ---------------------------------------------------------------------------
# Alertmanager (optional — configure when Alertmanager is deployed)
# ---------------------------------------------------------------------------
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

# ---------------------------------------------------------------------------
# Scrape Configurations
# ---------------------------------------------------------------------------
scrape_configs:
  # --- FraudAI Application ---
  - job_name: fraudai
    metrics_path: /api/v1/admin/metrics
    scheme: http
    static_configs:
      - targets: ["fraudai:8000"]
        labels:
          environment: production
    # Admin endpoint requires authentication (SR-012)
    # Token mounted as file to avoid hardcoding secrets
    bearer_token_file: /etc/prometheus/fraudai_token

  # --- Qdrant Vector Database ---
  - job_name: qdrant
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["qdrant:6333"]
        labels:
          environment: production

  # --- Ollama Local LLM ---
  - job_name: ollama
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s
    static_configs:
      - targets: ["ollama:11434"]
        labels:
          environment: production

  # --- Prometheus Self-Monitoring ---
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
